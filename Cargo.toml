[package]
name = "ddb-core"
version = "2.1.0"
edition = "2021"
authors = ["Charles Watkins <chris@watkinslabs.com>"]
description = "DDB v2: A high-performance SQL interface for flat files written in Rust"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/watkinslabs/ddb/"
homepage = "https://github.com/watkinslabs/ddb/"
documentation = "https://github.com/watkinslabs/ddb/blob/main/README.md"
readme = "README.md"
keywords = ["database", "csv", "sql", "parser", "mcp"]
categories = ["database", "parser-implementations"]
exclude = ["benches/", "tests/fixtures/"]

[dependencies]
# Parsing
nom = "7.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# File operations
fs2 = "0.4"  # File locking
memmap2 = "0.9"  # Memory-mapped files for large file handling
csv = "1.3"  # CSV parsing utilities

# CLI (optional, for binary)
clap = { version = "4.4", features = ["derive"], optional = true }

# String utilities
regex = "1.10"
lazy_static = "1.4"
base64 = "0.22"

# Output formatting
prettytable-rs = { version = "0.10", optional = true }

# Logging
log = "0.4"
env_logger = { version = "0.11", optional = true }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Parallel processing
rayon = "1.8"  # Data parallelism for aggregations

# MCP (Model Context Protocol) support - using direct JSON-RPC implementation
tokio = { version = "1.40", features = ["full"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"

[features]
default = ["cli", "mcp"]
cli = ["clap", "prettytable-rs", "env_logger"]
mcp = ["tokio", "tracing", "tracing-subscriber"]

[[bin]]
name = "ddb"
path = "src/bin/ddb.rs"
required-features = ["cli"]

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "concurrency_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
